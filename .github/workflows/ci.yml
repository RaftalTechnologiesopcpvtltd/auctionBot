name: AuctionBot CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Django Checks & Test Suite
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: auctionbot_ci_db
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password_12345
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Run Django System Checks
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-build-temporary-insecure-secret-key-for-checks-only
          POSTGRES_DB: auctionbot_ci_db
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password_12345
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          python manage.py check

      - name: Verify Migrations Are In Sync
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-build-temporary-insecure-secret-key-for-checks-only
          POSTGRES_DB: auctionbot_ci_db
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password_12345
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run Automated Test Suite
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DJANGO_SECRET_KEY: ci-build-temporary-insecure-secret-key-for-checks-only
          POSTGRES_DB: auctionbot_ci_db
          POSTGRES_USER: ci_test_user
          POSTGRES_PASSWORD: ci_test_password_12345
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
          CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/0
          CELERY_TASK_ALWAYS_EAGER: "True"
        run: |
          python manage.py test --verbosity=2
