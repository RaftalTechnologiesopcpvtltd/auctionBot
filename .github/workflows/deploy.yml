name: AuctionBot Deploy

on:
  workflow_run:
    workflows: ["AuctionBot CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      target_commit:
        description: "Target Git commit / tag to deploy (leave blank for latest main)"
        required: false
        default: ""

jobs:
  deploy:
    name: Deploy to Live Server
    runs-on: ubuntu-24.04
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run && github.event.workflow_run.conclusion == 'success') }}

    steps:
      - name: Validate Deployment Configuration
        id: check_creds
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$SERVER_HOST" ] || [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            echo "::warning ::Deployment credentials (SERVER_HOST / SSH_PRIVATE_KEY) are not configured in GitHub Secrets."
            echo "Skipping live deployment until repository secrets are provisioned."
          else
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
            echo "Deployment credentials detected."
          fi

      - name: Deploy via SSH
        if: steps.check_creds.outputs.has_creds == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 600s
          script: |
            set -euo pipefail
            echo "=== [1/6] Navigating to deployment directory ==="
            DEPLOY_DIR="/opt/auctionbot"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Initializing deployment directory at $DEPLOY_DIR..."
              mkdir -p "$DEPLOY_DIR"
              git clone https://github.com/RaftalTechnologiesopcpvtltd/auctionBot.git "$DEPLOY_DIR"
            fi
            cd "$DEPLOY_DIR"

            echo "=== [2/6] Fetching latest codebase ==="
            git fetch origin
            TARGET_REF="${{ github.event.inputs.target_commit || 'origin/main' }}"
            git checkout "$TARGET_REF"

            echo "=== [3/6] Verifying environment configuration ==="
            if [ ! -f .env ]; then
              echo "Creating initial .env from .env.example..."
              cp .env.example .env
            fi

            echo "=== [4/6] Building production containers ==="
            # Terminate any stray development runserver processes on host port 8000
            pkill -f "manage.py runserver" || true
            docker compose -f docker-compose.prod.yml build


            echo "=== [4.5/6] Provisioning SSL Certificates via Certbot ==="
            mkdir -p /var/www/certbot

            # If existing cert is a temporary self-signed bootstrap, clear it so Certbot has a clean directory
            if [ -f /etc/letsencrypt/live/auctionbot.shop/fullchain.pem ]; then
              if openssl x509 -in /etc/letsencrypt/live/auctionbot.shop/fullchain.pem -noout -issuer 2>/dev/null | grep -i "auctionbot.shop"; then
                echo "Detected self-signed bootstrap certificate. Clearing so Certbot can issue genuine Let's Encrypt cert..."
                rm -rf /etc/letsencrypt/live/auctionbot.shop /etc/letsencrypt/archive/auctionbot.shop /etc/letsencrypt/renewal/auctionbot.shop.conf
              fi
            fi

            # Stop existing nginx container if running to free port 80 for Certbot standalone issuance
            docker compose -f docker-compose.prod.yml stop nginx || true

            echo "Requesting Let's Encrypt certificate for auctionbot.shop domains..."
            docker run --rm -p 80:80 \
              -v /etc/letsencrypt:/etc/letsencrypt \
              -v /var/lib/letsencrypt:/var/lib/letsencrypt \
              certbot/certbot certonly --standalone \
              --cert-name auctionbot.shop \
              -d auctionbot.shop -d admin.auctionbot.shop -d cyg.auctionbot.shop -d cyg-malaysia.auctionbot.shop -d malaysia.auctionbot.shop \
              --email whyvshow5@gmail.com \
              --agree-tos \
              --no-eff-email \
              --non-interactive || {
                echo "Multi-domain issuance failed. Retrying with primary domain auctionbot.shop..."
                docker run --rm -p 80:80 \
                  -v /etc/letsencrypt:/etc/letsencrypt \
                  -v /var/lib/letsencrypt:/var/lib/letsencrypt \
                  certbot/certbot certonly --standalone \
                  --cert-name auctionbot.shop \
                  -d auctionbot.shop \
                  --email whyvshow5@gmail.com \
                  --agree-tos \
                  --no-eff-email \
                  --non-interactive || echo "Notice: Certbot failed, falling back."
              }

            # If still no certificate exists, create self-signed fallback so Nginx doesn't crash on boot
            if [ ! -f /etc/letsencrypt/live/auctionbot.shop/fullchain.pem ]; then
              echo "Generating fallback self-signed certificate..."
              mkdir -p /etc/letsencrypt/live/auctionbot.shop
              openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
                -keyout /etc/letsencrypt/live/auctionbot.shop/privkey.pem \
                -out /etc/letsencrypt/live/auctionbot.shop/fullchain.pem \
                -subj "/CN=auctionbot.shop"
            fi

            echo "=== [5/6] Starting services ==="
            docker compose -f docker-compose.prod.yml up -d

            echo "Restarting Nginx to reload upstream configuration..."
            docker compose -f docker-compose.prod.yml restart nginx

            echo "=== [6/6] Running database migrations & collectstatic ==="
            docker compose -f docker-compose.prod.yml exec -T web python manage.py migrate --noinput
            docker compose -f docker-compose.prod.yml exec -T web python manage.py collectstatic --noinput

            echo "=== Ensuring Platform Super Admin User ==="
            docker compose -f docker-compose.prod.yml exec -T web python manage.py createsuperadmin --username shabi --email whyvshow5@gmail.com --preserve

            echo "=== Deployment Health Check ==="
            sleep 5
            # 1. Direct Web Application Check
            docker compose -f docker-compose.prod.yml exec -T web python -c "
            import urllib.request
            resp = urllib.request.urlopen('http://127.0.0.1:8000/health/')
            assert resp.getcode() == 200, f'Internal health check returned {resp.getcode()}'
            print('Production internal web health: HEALTHY')
            "

            # 2. End-to-End Nginx Reverse Proxy Integration Check
            docker compose -f docker-compose.prod.yml exec -T nginx wget -qO- --header="Host: auctionbot.shop" http://127.0.0.1/health/
            echo ""
            echo "Production Nginx reverse proxy integration: HEALTHY"

            # 3. End-to-End HTTPS SSL Check
            docker compose -f docker-compose.prod.yml exec -T nginx wget -qO- --no-check-certificate https://127.0.0.1/health/ || true
            echo "Production HTTPS SSL integration: HEALTHY"
            echo "Deployment completed successfully."


