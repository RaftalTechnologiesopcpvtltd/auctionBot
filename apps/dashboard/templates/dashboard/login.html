<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AquaBid Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-800/90 rounded-2xl p-8 border border-slate-700/80 shadow-2xl backdrop-blur-md">
        <!-- Logo -->
        <div class="flex items-center justify-center space-x-3 mb-6">
            <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-white shadow-lg">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <div class="text-2xl font-bold tracking-tight text-white">AquaBid</div>
        </div>

        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-white">Management Dashboard</h1>
            <p class="text-sm text-slate-400 mt-1">Sign in with your staff or administrator account</p>
        </div>

        {% if messages %}
        <div class="space-y-2 mb-4">
            {% for msg in messages %}
            <div class="p-3 rounded-lg text-xs font-semibold {% if msg.tags == 'error' %}bg-red-500/20 text-red-300 border border-red-500/40{% else %}bg-blue-500/20 text-blue-300 border border-blue-500/40{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'dashboard:login' %}" class="space-y-4">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">
            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Username</label>
                <input type="text" id="username" name="username" required autofocus class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter username">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-2.5 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all" placeholder="Enter password">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm shadow-lg transition-colors focus:ring-2 focus:ring-blue-400">
                Sign In to Dashboard
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-slate-500">
            Unified Multi-Tenant Auction Platform &copy; 2026
        </div>
    </div>
</body>
</html>
