<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tenant Not Found - AquaBid Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200/80 p-8 text-center space-y-6">
        <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto text-2xl font-bold">
            404
        </div>
        <div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Organization Not Found</h1>
            <p class="text-sm text-slate-500 mt-2">
                No active tenant organization matches subdomain <span class="font-mono font-semibold text-slate-800 bg-slate-100 px-2 py-0.5 rounded">{{ subdomain }}</span>.
            </p>
        </div>
        <div class="pt-2 text-xs text-slate-400">
            If you are a platform administrator, visit the
            <a href="http://admin.auctionbot.shop/super-admin/" class="text-blue-600 hover:underline font-semibold">Super Admin Portal</a>
            to register this tenant.
        </div>
    </div>
</body>
</html>
