<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Super Admin - Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 rounded-3xl p-8 border border-slate-800 shadow-2xl relative overflow-hidden">
        <!-- Accent Glow -->
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-8 relative">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-indigo-600 to-blue-500 flex items-center justify-center font-bold text-white shadow-xl shadow-blue-500/25 mx-auto mb-4 text-xl">
                ⚡
            </div>
            <div class="inline-block px-3 py-1 rounded-full bg-indigo-500/10 border border-indigo-500/30 text-[11px] font-semibold text-indigo-400 uppercase tracking-widest mb-2">
                Root Security Gateway
            </div>
            <h1 class="text-2xl font-extrabold tracking-tight text-white">Super Admin Portal</h1>
            <p class="text-xs text-slate-400 mt-1 font-mono">admin.auctionbot.shop</p>
        </div>

        {% if messages %}
        <div class="space-y-2 mb-6">
            {% for msg in messages %}
            <div class="p-3 rounded-xl text-xs font-semibold {% if msg.tags == 'error' %}bg-red-500/20 text-red-300 border border-red-500/40{% else %}bg-blue-500/20 text-blue-300 border border-blue-500/40{% endif %}">
                {{ msg }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'super_admin:login' %}" class="space-y-5">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.GET.next }}">

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Platform Admin Username</label>
                <input type="text" id="username" name="username" required autofocus class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="admin">
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">Platform Admin Password</label>
                <input type="password" id="password" name="password" required class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-700/80 text-white placeholder-slate-500 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all" placeholder="••••••••••••">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-semibold rounded-xl text-sm shadow-xl shadow-indigo-500/25 transition-all">
                Authenticate as Super Admin
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-slate-800 text-center text-xs text-slate-500 font-mono">
            Restricted System Access &bull; All Actions Audited
        </div>
    </div>
</body>
</html>
