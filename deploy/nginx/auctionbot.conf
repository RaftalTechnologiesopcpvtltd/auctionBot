# Map connection header based on Upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP server - handles ACME challenge, healthcheck, and redirects everything else to HTTPS
server {
    listen 80;
    server_name _;
    client_max_body_size 25M;

    # Embedded Docker DNS resolver with 5s TTL to avoid stale container IP caching
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $django_upstream http://web:8000;

    # Let's Encrypt ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Direct internal health check (bypasses HTTPS redirect for Docker monitoring)
    location = /health/ {
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server - secure production traffic
server {
    listen 443 ssl;
    server_name _;
    client_max_body_size 25M;

    # SSL Certificates managed via Certbot / Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/auctionbot.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auctionbot.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Embedded Docker DNS resolver with 5s TTL to avoid stale container IP caching
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $django_upstream http://web:8000;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Let's Encrypt ACME renewal support on HTTPS as well
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media files (uploaded item pictures)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Application endpoints
    location / {
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
