services:
  postgres:
    image: postgres:16-alpine
    container_name: auctionbot_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auctionbot_prod_db}
      POSTGRES_USER: ${POSTGRES_USER:-auctionbot_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - auctionbot_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auctionbot_prod_user} -d ${POSTGRES_DB:-auctionbot_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: auctionbot_prod_redis
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - auctionbot_internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: auctionbot_prod_web
    restart: always
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    networks:
      - auctionbot_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: auctionbot_prod_worker
    restart: always
    command: celery -A config worker --loglevel=INFO --concurrency=4
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - auctionbot_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:1.25-alpine
    container_name: auctionbot_prod_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/auctionbot.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    networks:
      - auctionbot_internal
    depends_on:
      - web

networks:
  auctionbot_internal:
    driver: bridge

volumes:
  postgres_prod_data:
  redis_prod_data:
  staticfiles_data:
  media_data:
